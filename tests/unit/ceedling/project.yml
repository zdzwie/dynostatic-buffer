# =========================================================================
#   Ceedling project for the dynostatic-buffer unit tests.
#
#   This suite mirrors, test for test, the GoogleTest suite that lives one
#   directory up in tests/unit/*.cpp. Both suites are kept: GoogleTest is
#   driven by CMake/CTest and Bazel, this one by Ceedling/Unity, so the
#   library can be verified with a pure-C, embedded-friendly toolchain.
#
#   Run from this directory:
#     ceedling test:all
# =========================================================================

---
:project:
  :name: "dynostatic-buffer"

  :which_ceedling: gem
  :ceedling_version: 1.1.7

  # No CMock: the library under test has no external dependencies to fake,
  # every test drives the public API directly.
  :use_mocks: FALSE
  :use_test_preprocessor: :none
  :use_backtrace: :simple

  :build_root: build
  :test_file_prefix: test_
  :default_tasks:
    - test:all

  :test_threads: 8
  :compile_threads: 8

  :release_build: FALSE

# `ceedling --mixin=zero_on_free_off test:all` reruns the suite with
# DS_ZERO_ON_FREE=0 (see mixins/zero_on_free_off.yml).
:mixins:
  :enabled: []
  :load_paths:
    - mixins

:test_build:
  :use_assembly: FALSE

:plugins:
  :load_paths: []
  :enabled:
    - report_tests_pretty_stdout

:extension:
  :executable: .out

# The library lives outside this directory; paths are relative to project.yml.
:paths:
  :test:
    - +:test/**
    - -:test/support
  :source:
    - ../../../library
  :include:
    - ../../../library
  :support:
    - test/support
  :libraries: []

:files:
  :test: []
  :source: []

# These symbols change the layout of dynostatic_buffer_t, so they must match
# the CMake (library/CMakeLists.txt) and Bazel (library/BUILD.bazel) builds
# exactly — otherwise the tests would exercise a differently sized allocator.
# DS_ZERO_ON_FREE is deliberately not listed: mixins append to this list, so
# the default run uses the header default (1) and the zero_on_free_off mixin
# adds DS_ZERO_ON_FREE=0. DS_ALIGNMENT is left out for the same reason: like
# the other builds, the default run uses the header default
# alignof(ds_max_align_t); a mixin can append DS_ALIGNMENT=<n>. Ceedling
# compiles the library and the tests with this one list, so they always agree.
:defines:
  :test:
    - TEST
    - DS_BUFFER_MEMORY_SIZE=1024
    - DS_LOG_ENABLE=1u
    - DS_MAX_ALLOCATION_COUNT=10
    - DS_MAX_ALLOCATION_SIZE=512
  :release: []
  :use_test_definition: FALSE

:flags:
  :test:
    :compile:
      '*':
        # The public header needs C11 (_Static_assert, <stdalign.h>), matching
        # target_compile_features(... c_std_11) in library/CMakeLists.txt.
        - -std=gnu11
        - -Wall

:cmock:
  :plugins: []
  :verbosity: 2

:unity:
  :defines:
    - UNITY_EXCLUDE_FLOAT
    - UNITY_INCLUDE_PRINT_FORMATTED
    - UNITY_SUPPORT_TEST_CASES

:environment: []

:libraries:
  :placement: :end
  :flag: "-l${1}"
  :path_flag: "-L ${1}"
  :system: []
  :test: []
  :release: []
...
